<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#122824" />
    <title>Offline — Spinwheels</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef0e7;
        --ink: #142420;
        --muted: #55655f;
        --teal: #122824;
        --yellow: #ffc93c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      .badge {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: var(--teal);
        display: grid;
        place-items: center;
        font-size: 2rem;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.55;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 13px 22px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        background: var(--yellow);
        color: var(--teal);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge" aria-hidden="true">📡</div>
      <h1>You&apos;re offline</h1>
      <p>
        Spinwheels needs an internet connection to browse cars and manage bookings. Reconnect and
        try again.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
